<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Home — Page by Page Flip Up</title>
<style>
  :root{
    --bg: #0b0b0c;
    --panel: #000000;
    --ink: #fafafa;
    --accent: #eb6b0e;
    --accent-2: #ff7745;
  }
  *{ box-sizing: border-box; }
  html, body{
    margin:0;
    height:100%;
    background: radial-gradient(ellipse at 50% 0%, #1a1a1c 0%, var(--bg) 60%);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    overflow:hidden;
  }

  .stage{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:20px;
  }

  .hint{
    color:#8a8a8e;
    font-size:12px;
    letter-spacing:.04em;
    text-transform:uppercase;
  }
  .hint b{ color: var(--accent-2); font-weight:600; }

  .phone{
    position:relative;
    width: 300px;
    height: 640px;
    perspective: 2400px;
    border-radius: 38px;
    padding:10px;
    background: linear-gradient(160deg,#2a2a2d,#111112 60%);
    box-shadow:
      0 0 0 1px rgba(255,255,255,.05) inset,
      0 40px 80px -20px rgba(0,0,0,.7),
      0 0 60px -10px rgba(235,107,14,.08);
  }

  .screen{
    position:relative;
    width:100%;
    height:100%;
    border-radius: 30px;
    overflow:hidden;
    background: var(--panel);
  }

  .notch{
    position:absolute;
    top:10px; left:50%;
    transform:translateX(-50%);
    width:120px; height:22px;
    background:#0a0a0b;
    border-radius:14px;
    z-index:20;
  }

  .stack{
    position:absolute;
    inset:0;
    perspective: 1800px;
  }

  /* each leaf is one screen-height slice of the tall design */
  .leaf{
    position:absolute;
    inset:0;
    transform-style: preserve-3d;
    transform-origin: top center;
    transition: transform .85s cubic-bezier(.6,.05,.3,1), box-shadow .85s;
    background-repeat: no-repeat;
    background-color:#000;
    will-change: transform;
  }

  .leaf .fold-shadow{
    position:absolute; inset:0;
    background: linear-gradient(180deg, rgba(0,0,0,.5) 0%, rgba(0,0,0,0) 35%);
    opacity:0;
    transition: opacity .5s ease;
    pointer-events:none;
  }
  .leaf.flying .fold-shadow{ opacity:1; }

  .leaf.flying{
    transform: rotateX(-115deg) translateY(-6%);
    box-shadow: 0 30px 40px -10px rgba(0,0,0,.6);
  }

  .leaf .pagenum{
    position:absolute;
    bottom:10px; right:14px;
    color:#7a7a7e;
    font-size:11px;
    letter-spacing:.05em;
    z-index:2;
  }

  .edge-tap{
    position:absolute;
    top:0; right:0;
    width:34px; height:100%;
    z-index:15;
    cursor:pointer;
  }
  .edge-tap.bottom{
    top:auto; bottom:0; right:0; left:0;
    width:100%; height:34px;
  }

  .controls{
    display:flex;
    gap:12px;
    align-items:center;
  }
  .btn{
    appearance:none;
    border:1px solid rgba(255,255,255,.12);
    background: rgba(255,255,255,.04);
    color: var(--ink);
    padding:9px 18px;
    border-radius: 999px;
    font-size:13px;
    font-weight:600;
    letter-spacing:.02em;
    cursor:pointer;
    transition: all .2s ease;
  }
  .btn:hover{
    border-color: var(--accent);
    background: rgba(235,107,14,.12);
  }
  .btn.primary{
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border:none;
  }
  .btn:disabled{
    opacity:.35;
    cursor:not-allowed;
  }
  .counter{
    color:#9a9a9e;
    font-size:12px;
    min-width:46px;
    text-align:center;
  }
</style>
</head>
<body>

  <div class="stage">
    <div class="hint">Tap the bottom edge, or use <b>Next / Back</b> — pages flip up like a notepad</div>

    <div class="phone">
      <div class="screen" id="screen">
        <div class="notch"></div>
        <div class="stack" id="stack"><!-- leaves injected by JS --></div>
        <div class="edge-tap bottom" id="edgeTap"></div>
      </div>
    </div>

    <div class="controls">
      <button class="btn" id="prevBtn">Back</button>
      <span class="counter" id="counter">1 / 1</span>
      <button class="btn primary" id="nextBtn">Next</button>
    </div>
  </div>

<script>
(function(){
  const IMG_SRC = "Home.svg";
  const VB_WIDTH = 1024.5;   // original SVG viewBox width
  const VB_HEIGHT = 3456;    // original SVG viewBox height

  const stack = document.getElementById('stack');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const counter = document.getElementById('counter');
  const edgeTap = document.getElementById('edgeTap');

  const frameW = stack.clientWidth;
  const frameH = stack.clientHeight;

  // scale so the design's width fills the frame; compute total scaled height
  const scale = frameW / VB_WIDTH;
  const totalScaledHeight = VB_HEIGHT * scale;
  const pageCount = Math.max(1, Math.ceil(totalScaledHeight / frameH));

  const leaves = [];
  for (let i = 0; i < pageCount; i++){
    const leaf = document.createElement('div');
    leaf.className = 'leaf';
    leaf.style.backgroundImage = `url(${IMG_SRC})`;
    leaf.style.backgroundSize = `${frameW}px ${totalScaledHeight}px`;
    leaf.style.backgroundPosition = `0 ${-(i * frameH)}px`;
    leaf.style.zIndex = String(pageCount - i);

    const shadow = document.createElement('div');
    shadow.className = 'fold-shadow';
    leaf.appendChild(shadow);

    const num = document.createElement('div');
    num.className = 'pagenum';
    num.textContent = (i + 1) + ' / ' + pageCount;
    leaf.appendChild(num);

    stack.appendChild(leaf);
    leaves.push(leaf);
  }

  let current = 0; // index of the top-most (frontmost) visible leaf

  function updateUI(){
    counter.textContent = (current + 1) + ' / ' + pageCount;
    prevBtn.disabled = current === 0;
    nextBtn.disabled = current === pageCount - 1;
  }

  function restack(){
    leaves.forEach((leaf, i) => {
      // pages before `current` stay flipped away; current and after sit in normal stack order
      if (i < current){
        leaf.style.zIndex = String(i + 1);
      } else {
        leaf.style.zIndex = String(pageCount - i + pageCount);
      }
    });
  }

  function next(){
    if (current >= pageCount - 1) return;
    const leaf = leaves[current];
    leaf.classList.add('flying');
    current++;
    restack();
    updateUI();
  }

  function prev(){
    if (current <= 0) return;
    current--;
    const leaf = leaves[current];
    leaf.classList.remove('flying');
    restack();
    updateUI();
  }

  nextBtn.addEventListener('click', next);
  prevBtn.addEventListener('click', prev);
  edgeTap.addEventListener('click', next);

  restack();
  updateUI();
})();
</script>

</body>
</html>
